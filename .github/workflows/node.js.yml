name: Run Jest Tests, Build and Deploy

on:
  push:
    branches:  
      - pruebas/gammificacion
  pull_request:
    branches: 
      - pruebas/gammificacion

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update browserslist
        run: npx update-browserslist-db@latest

      - name: Build frontend
        run: npm run build
        env:
          CI: false

      - name: Run specific tests with coverage
        run: |
          npm test -- --coverage --testPathPattern="src/pages/administrador/pages/gamificacion/(RecompensaTab|PacientesTab|ServiciosTab)\.test\.js"
        env:
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/

  deploy-to-hostinger:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build/

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Deploy to Hostinger via FTP (overwrite all build files)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set mirror:use-pget-n 5
          # Sobrescribe todos los archivos del build dentro de public_html/
          mirror -R --verbose --ignore-time --overwrite build/ public_html/
          bye
          EOF
