name: Run Jest Tests, Build and Deploy

on:
  push:
    branches: 
      - pruebas/gammificacion
  pull_request:
    branches: 
      - pruebas/gammificacion

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update browserslist
        run: npx update-browserslist-db@latest

      - name: Build frontend
        run: npm run build
        env:
          CI: false

      - name: Run specific tests with coverage
        run: |
          npm test -- --coverage --testPathPattern="src/pages/administrador/pages/gamificacion/(RecompensaTab|PacientesTab|ServiciosTab)\.test\.js"
        env:
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/
          retention-days: 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  deploy-to-hostinger:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build/

      - name: List local build files (debug)
        run: |
          echo "Contenido de build/ después de descargar:"
          ls -la build/ || echo "No se encontró la carpeta build/"

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Deploy to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          # Validar que las variables existan
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Error: Faltan credenciales FTP en secrets"
            exit 1
          fi

          echo "Iniciando deploy a $FTP_HOST..."

          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set mirror:use-pget-n 5
          set net:timeout 30
          set net:max-retries 3

          # Debug: listar contenido actual en el servidor
          echo "=== Contenido actual en public_html/ ==="
          ls -la public_html/ || echo "No se pudo listar (puede no existir)"

          # Forzar subida completa: SIN --only-newer
          echo "Subiendo archivos desde build/ a public_html/..."
          mirror -R \
            --delete \
            --verbose \
            --parallel=10 \
            build/ public_html/

          # Confirmar después del deploy
          echo "=== Contenido FINAL en public_html/ ==="
          ls -la public_html/ || echo "No se pudo listar al final"

          bye
          EOF

          echo "Deploy completado."